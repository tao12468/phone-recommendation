<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手机推荐平台</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>手机推荐平台</h1>
        <p>登录后获得个性化推荐</p>
      </div>
      <div>
        <span id="login-user" class="health"></span>
        <button id="logout-btn" class="hidden" type="button">退出登录</button>
      </div>
    </header>

    <main>
      <section id="auth-panel" class="panel">
        <h2>登录 / 注册</h2>
        <div class="filter-row">
          <label>
            用户名
            <input id="username" type="text" placeholder="请输入用户名" />
          </label>
          <label>
            密码
            <input id="password" type="password" placeholder="请输入密码" />
          </label>
          <button id="login-btn" type="button">登录</button>
          <button id="register-btn" type="button">注册</button>
        </div>
        <p id="auth-message" class="empty"></p>
      </section>

      <section id="main-panel" class="hidden">
        <section class="panel">
          <h2>偏好设置</h2>
          <div class="pref-grid">
            <label>
              预算
              <select id="budget">
                <option value="">不限</option>
                <option value="1500">2000 元以下</option>
                <option value="3000">2000 - 4000 元</option>
                <option value="5000">4000 - 6000 元</option>
                <option value="7000">6000 - 8000 元</option>
                <option value="9000">8000 元以上</option>
              </select>
            </label>
            <div class="pref-group">
              <span>品牌</span>
              <div id="brand-options" class="check-group">
                <label><input type="checkbox" value="华为" /> 华为</label>
                <label><input type="checkbox" value="vivo" /> vivo</label>
                <label><input type="checkbox" value="OPPO" /> OPPO</label>
                <label><input type="checkbox" value="苹果" /> 苹果</label>
                <label><input type="checkbox" value="三星" /> 三星</label>
                <label><input type="checkbox" value="荣耀" /> 荣耀</label>
              </div>
            </div>
            <div class="pref-group">
              <span>使用场景</span>
              <div id="scene-options" class="check-group">
                <label><input type="checkbox" value="游戏" /> 游戏</label>
                <label><input type="checkbox" value="拍照" /> 拍照</label>
                <label><input type="checkbox" value="音乐" /> 音乐</label>
                <label><input type="checkbox" value="商务" /> 商务</label>
                <label><input type="checkbox" value="自拍" /> 自拍</label>
                <label><input type="checkbox" value="快充" /> 快充</label>
                <label><input type="checkbox" value="5G" /> 5G</label>
                <label><input type="checkbox" value="折叠屏" /> 折叠屏</label>
                <label><input type="checkbox" value="大屏" /> 大屏</label>
              </div>
            </div>
            <label>
              系统
              <select id="os">
                <option value="">不限</option>
                <option value="安卓">安卓</option>
                <option value="iOS">iOS</option>
                <option value="鸿蒙">鸿蒙</option>
              </select>
            </label>
          </div>
          <button id="recommend-btn" type="button">获取推荐</button>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>推荐结果</h2>
            <button id="pref-btn" type="button">查看我的偏好</button>
          </div>
          <div id="result-list" class="card-list"></div>
        </section>
      </section>
    </main>

    <div id="detail-modal" class="modal hidden">
      <div class="modal-box">
        <button id="close-detail" class="close-btn" type="button">×</button>
        <div id="detail-content"></div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
